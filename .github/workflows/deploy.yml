name: Deploy LUG Demo plugin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lug-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy plugin over FTPS
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          SFTP_USER: ${{ secrets.ftp_user }}
          SFTP_PASS: ${{ secrets.sftp_pass }}
          SFTP_PATH: ${{ vars.sftp_path }}
        run: |
          test -n "$SFTP_USER" || { echo "Missing SFTP_USER secret" >&2; exit 1; }
          test -n "$SFTP_PASS" || { echo "Missing SFTP_PASS secret" >&2; exit 1; }
          test -n "$SFTP_PATH" || { echo "Missing sftp_path repository variable" >&2; exit 1; }

      - name: Lint and test safety boundaries
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/mail-safety.php
          python3 tests/ftp-root.py

      - name: Verify existing plugin destination
        id: path
        env:
          SFTP_USER: ${{ secrets.ftp_user }}
          SFTP_PASS: ${{ secrets.sftp_pass }}
          SFTP_PATH: ${{ vars.sftp_path }}
        run: python3 tools/check-ftp-root.py

      - name: Prepare plugin package
        run: |
          mkdir -p deploy/plugin
          git rev-parse --short HEAD > deploy/plugin/BUILD_SHA
          cp lug-demo.php README.md deploy/plugin/
          cp -R assets includes fixtures deploy/plugin/

      - name: Deploy plugin directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.steelcitylug.com
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.sftp_pass }}
          protocol: ftps
          local-dir: deploy/plugin/
          server-dir: ${{ steps.path.outputs.remote }}
          dangerous-clean-slate: false
